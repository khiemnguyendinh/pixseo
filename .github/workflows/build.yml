# Builds and tests on every push and pull request; on a version tag (v0.1.0) also attaches the
# universal DMG to a draft GitHub release for the maintainer to review and publish.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build DMG
        run: scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PixSEO-dmg
          path: release/*
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Skipped when the maintainer already published this release by hand.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" release/* --draft --title "PixSEO $GITHUB_REF_NAME" --notes-file Resources/DMG/HUONG-DAN-CAI-DAT.txt
